---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-app
  namespace: hotel-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-app
  template:
    metadata:
      labels:
        app: hotel-app
    spec:
      containers:
      - name: hotel-app
        image: 744111607961.dkr.ecr.us-east-1.amazonaws.com/bs
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-app
  namespace: hotel-app
spec:
  selector:
    app: hotel-app
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotel-app-ingress
  namespace: hotel-app
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hotel-app
            port:
              number: 80
